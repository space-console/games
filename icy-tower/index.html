<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- TV browsers default to a desktop-width viewport; pin to device width and lock zoom for the 10-foot UI. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05060f" />
  <title>Icy Tower — Space Console</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- safe-area wrapper protects against TV overscan; see --safe-* in base.css -->
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <a href="../" aria-label="Back to games">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">Icy Tower</span>
        </a>
      </div>
      <div class="topbar__hint" id="status" aria-live="polite">Press Enter to climb</div>
      <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Toggle sound" title="Toggle sound (M)">🔊</button>
    </header>

    <main class="stage">
      <!-- Playfield: a tall portrait tower -->
      <section class="board" aria-label="Playfield">
        <canvas id="board" width="460" height="680"></canvas>
        <!-- Overlay for start / game-over messaging -->
        <div class="overlay" id="overlay">
          <div class="overlay__card">
            <h1 class="overlay__title" id="overlayTitle">Icy Tower</h1>
            <p class="overlay__msg" id="overlayMsg">Run fast to jump high — chain floors for combos!<br>Tap or press <kbd>Space</kbd> to climb</p>
          </div>
        </div>
      </section>

      <!-- Side panel: scoreboard -->
      <aside class="panel" aria-label="Game info">
        <dl class="scoreboard">
          <div class="score"><dt>Score</dt><dd id="score">0</dd></div>
          <div class="score"><dt>Floor</dt><dd id="floor">0</dd></div>
          <div class="score"><dt>Best</dt><dd id="best">0</dd></div>
        </dl>

        <!-- On-screen controls (touch devices only) -->
        <div class="touch-controls touch-only" id="touchControls" aria-hidden="true">
          <button class="tbtn" id="btnLeft" type="button" data-touch-ignore aria-label="Move left">◀</button>
          <button class="tbtn tbtn--jump" id="btnJump" type="button" data-touch-ignore aria-label="Jump">JUMP</button>
          <button class="tbtn" id="btnRight" type="button" data-touch-ignore aria-label="Move right">▶</button>
        </div>
      </aside>
    </main>

    <footer class="hintbar" id="hintbar">
      <span class="hint"><kbd class="key">← →</kbd> Run</span>
      <span class="hint"><kbd class="key">Space</kbd> Jump</span>
      <span class="hint"><kbd class="key">↑</kbd> Jump</span>
      <span class="hint"><kbd class="key">Enter</kbd> Start</span>
      <span class="hint"><kbd class="key">Back</kbd> Menu</span>
      <span class="hint"><kbd class="key">M</kbd> Mute</span>
    </footer>
  </div>

  <script type="module" src="./app.js?v=96cdcc4c-66c0-44ef-a78b-0261384d5fad"></script>
</body>
</html>
