<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05060f" />
  <title>Star Hopper — Space Console</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <a href="../" aria-label="Back to games">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">Star Hopper</span>
        </a>
      </div>
      <div class="topbar__hint" id="status" aria-live="polite">Press Enter to start</div>
      <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Toggle sound" title="Toggle sound (M)">🔊</button>
    </header>

    <main class="stage">
      <section class="board" aria-label="Playfield">
        <canvas id="board" width="512" height="448"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay__card">
            <h1 class="overlay__title" id="overlayTitle">Star Hopper</h1>
            <p class="overlay__msg" id="overlayMsg">Run and jump to the flag — stomp the slimes, grab the coins!<br>Press <kbd>Enter</kbd> to start</p>
          </div>
        </div>
      </section>

      <aside class="panel" aria-label="Game info">
        <dl class="scoreboard">
          <div class="score"><dt>Coins</dt><dd id="coins">0</dd></div>
          <div class="score"><dt>Lives</dt><dd id="lives">3</dd></div>
          <div class="score"><dt>Best</dt><dd id="best">0</dd></div>
        </dl>

        <div class="touch-controls touch-only" id="touchControls" aria-hidden="true">
          <div class="pad">
            <button class="tbtn" id="bLeft" data-touch-ignore aria-label="Left">◀</button>
            <button class="tbtn" id="bRight" data-touch-ignore aria-label="Right">▶</button>
          </div>
          <button class="tbtn tbtn--jump" id="bJump" data-touch-ignore aria-label="Jump">JUMP</button>
        </div>
      </aside>
    </main>

    <footer class="hintbar" id="hintbar">
      <span class="hint"><kbd class="key">← →</kbd> Run</span>
      <span class="hint"><kbd class="key">Space</kbd> Jump</span>
      <span class="hint"><kbd class="key">↑</kbd> Jump</span>
      <span class="hint"><kbd class="key">Enter</kbd> Start</span>
      <span class="hint"><kbd class="key">Back</kbd> Menu</span>
      <span class="hint"><kbd class="key">M</kbd> Mute</span>
    </footer>
  </div>

  <script type="module" src="./app.js?v=f4e4e8d6-32aa-475e-b4ae-62edda0de0b7"></script>
</body>
</html>
