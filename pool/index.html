<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- TV browsers default to a desktop-width viewport; pin to device width and lock zoom for the 10-foot UI. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05060f" />
  <title>8-Ball Pool — Space Console</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- safe-area wrapper protects against TV overscan; see --safe-* in base.css -->
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <a href="../" aria-label="Back to games">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">8-Ball Pool</span>
        </a>
      </div>
      <div class="topbar__hint" id="status" aria-live="polite">Pick a mode</div>
      <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Toggle sound" title="Toggle sound (M)">🔊</button>
    </header>

    <main class="stage">
      <!-- The table. The canvas sizes itself to this box (and turns a quarter
           turn on portrait phones); app.js owns every pixel inside it.
           [data-touch-ignore] keeps the shared swipe/tap gesture layer off the
           felt so drags aim the cue instead of firing stray intents. -->
      <section class="board" aria-label="Pool table">
        <canvas id="board" data-touch-ignore></canvas>
        <div class="toast" id="toast" aria-live="polite"></div>
        <div class="overlay" id="overlay">
          <div class="overlay__card">
            <h1 class="overlay__title" id="overlayTitle">8-Ball Pool</h1>
            <p class="overlay__msg" id="overlayMsg">Rack 'em up.</p>
            <!-- Mode / rematch menu: arrow-selectable and tappable -->
            <div class="menu" id="menu" role="menu" aria-label="Game mode"></div>
          </div>
        </div>
      </section>

      <!-- Side panel: whose turn it is, both racks, power and spin -->
      <aside class="panel" aria-label="Game info">
        <div class="panel__block turn">
          <div class="panel__label">Shooting</div>
          <div class="turn__name" id="turnName">—</div>
          <div class="turn__group" id="turnGroup">—</div>
        </div>

        <div class="players">
          <div class="pcard" id="p1card">
            <div class="pcard__top">
              <span class="pcard__name" id="p1name">Player 1</span>
              <span class="pcard__group" id="p1group">Open</span>
            </div>
            <div class="rack" id="p1rack"></div>
          </div>
          <div class="pcard" id="p2card">
            <div class="pcard__top">
              <span class="pcard__name" id="p2name">Player 2</span>
              <span class="pcard__group" id="p2group">Open</span>
            </div>
            <div class="rack" id="p2rack"></div>
          </div>
        </div>

        <div class="panel__block meter">
          <div class="panel__label">Power <span class="meter__value" id="powerValue">0%</span></div>
          <div class="meter__track"><div class="meter__fill" id="powerFill"></div></div>
        </div>

        <!-- Where the tip strikes the cue ball: drag the dot, or use ↑ / ↓. -->
        <div class="panel__block spin">
          <div class="panel__label">Spin</div>
          <div class="spin__pad" id="spinPad" data-touch-ignore role="img" aria-label="Cue ball strike point">
            <span class="spin__dot" id="spinDot"></span>
          </div>
        </div>
      </aside>
    </main>

    <!-- On-screen controls (touch devices only; built in app.js). Aim and shoot
         need press/release, so they wire their own pointer listeners. -->
    <section class="touch-only touch-controls" id="touchControls" aria-label="Touch controls"></section>

    <footer class="hintbar" id="hintbar">
      <span class="hint"><kbd class="key">←</kbd><kbd class="key">→</kbd> Aim (hold)</span>
      <span class="hint"><kbd class="key">↑</kbd><kbd class="key">↓</kbd> Follow · Draw</span>
      <span class="hint"><kbd class="key">Space</kbd> Hold to power, release to shoot</span>
      <span class="hint">Drag the table to aim · pull back from the cue ball to shoot</span>
      <span class="hint"><kbd class="key">Back</kbd> Menu</span>
      <span class="hint"><kbd class="key">M</kbd> Mute</span>
    </footer>
  </div>

  <script type="module" src="./app.js?v=5f45cf0e-18e1-45f6-8078-fe425c1f5555"></script>
</body>
</html>
